<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #020817;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .auth-card h1 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }
        .auth-card p {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            width: 100%;
            padding: 10px 40px 10px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
        }
        .password-wrapper input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #94a3b8;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .toggle-password:hover {
            color: #3b82f6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2563eb;
        }
        .create-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .create-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .create-link a:hover {
            text-decoration: underline;
        }
        .back-home {
            text-align: center;
            margin-top: 24px;
        }
        .back-home a {
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }
        .back-home a:hover {
            color: #3b82f6;
        }
        .error-msg {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>管理员登录</h1>
        <p>请使用管理员账号登录</p>
        <div id="errorMsg" class="error-msg"></div>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label>密码</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="请输入密码">
                <button type="button" class="toggle-password" id="togglePassword">👁️</button>
            </div>
        </div>
        <button class="btn" id="loginBtn">立即登录</button>
        <div class="create-link">
            <a href="setup.html">点击可以创建管理员账号</a>
        </div>
        <div class="back-home">
            <a href="tancs.HTML" id="backHomeLink">← 回到主页面</a>
        </div>
    </div>

    <script>
        // 获取URL参数
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const redirectTarget = getUrlParam('redirect') || 'guanli.HTML';
        const fromPage = getUrlParam('from') || 'tancs.HTML';

        // 存储管理员账号 (localStorage)
        function getAdmin() {
            const adminStr = localStorage.getItem('snake_admin');
            if (adminStr) {
                try {
                    return JSON.parse(adminStr);
                } catch(e) {}
            }
            return null;
        }

        function setAdmin(username, password) {
            localStorage.setItem('snake_admin', JSON.stringify({ username, password }));
        }

        function login(username, password) {
            const admin = getAdmin();
            if (admin && admin.username === username && admin.password === password) {
                sessionStorage.setItem('snake_admin_logged', 'true');
                sessionStorage.setItem('snake_admin_username', username);
                window.location.href = `${redirectTarget}?from=${encodeURIComponent(fromPage)}`;
                return true;
            }
            return false;
        }

        // 登录按钮事件
        document.getElementById('loginBtn').addEventListener('click', () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');

            if (!username || !password) {
                errorDiv.textContent = '请填写完整';
                errorDiv.style.display = 'block';
                return;
            }

            if (login(username, password)) {
                // 成功跳转
            } else {
                errorDiv.textContent = '用户名或密码错误';
                errorDiv.style.display = 'block';
            }
        });

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        // 如果已经登录，直接跳转
        if (sessionStorage.getItem('snake_admin_logged') === 'true') {
            window.location.href = `${redirectTarget}?from=${encodeURIComponent(fromPage)}`;
        }

        // 返回主页面链接保持来源
        const backLink = document.getElementById('backHomeLink');
        backLink.href = `tancs.HTML?from=${encodeURIComponent(fromPage)}`;

        // ========== 密码显示/隐藏切换 ==========
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });
    </script>
</body>
</html>
